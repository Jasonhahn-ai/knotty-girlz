# Netlify settings for the Knotty Girlz site.
# It's plain HTML, so there is no build step — Netlify just publishes this folder.
[build]
  publish = "."

# Send anyone who visits the old knotty-girlz.netlify.app address to the real domain,
# keeping the same page (e.g. /shop.html). Deploy previews use a different address, so they still work.
[[redirects]]
  from = "https://knotty-girlz.netlify.app/*"
  to = "https://knottygirlzboutique.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://knotty-girlz.netlify.app/*"
  to = "https://knottygirlzboutique.com/:splat"
  status = 301
  force = true

# Custom orders are paused: send old links to the Shop page.
# 302 (temporary) so it's easy to bring the page back later.
# To restore: copy custom-orders.html back from "Knotty Girlz Originals/Custom Orders (paused)" and delete these two rules.
[[redirects]]
  from = "/custom-orders"
  to = "/shop.html"
  status = 302
  force = true

[[redirects]]
  from = "/custom-orders.html"
  to = "/shop.html"
  status = 302
  force = true

# Internal notes live in the GitHub repo only. Show "page not found" if anyone visits them on the website.
# (LISA-GUIDE.pdf stays public so it can be sent to Lisa as a link.)
# If you add another internal note to this folder, add a rule for it here.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LISA-GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LISA-GUIDE-print.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LISA-GUIDE-print"
  to = "/404.html"
  status = 404
  force = true
